name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request: # L'APK est aussi construit pour chaque PR afin de pouvoir la tester avant merge
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Node Version
      run: node -v

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.14.3'

    - name: Install npm dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Generate Android Assets
      run: npx @capacitor/assets generate --android --assetPath public

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Restore debug keystore
      # Clé stable (SHA-1 enregistré dans Firebase pour le Google Sign-In natif). Reconstruite depuis le secret
      # DEBUG_KEYSTORE_B64 si présent (voir docs/SIGNATURE_DEBUG.md) ; sinon une clé jetable est générée pour que
      # la compilation reste toujours verte (Google Sign-In natif ne fonctionnera simplement pas avec cet APK-là).
      working-directory: android
      run: |
        if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > app/kwa-watt-debug.p12
          echo "Clé de signature restaurée depuis le secret DEBUG_KEYSTORE_B64."
        else
          echo "::warning::DEBUG_KEYSTORE_B64 absent : génération d'une clé de debug jetable (voir docs/SIGNATURE_DEBUG.md)."
          keytool -genkeypair -v -keystore app/kwa-watt-debug.p12 -storetype PKCS12 \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=KWA-WATT CI, OU=Dev, O=KWA-WATT, L=Douala, ST=Littoral, C=CM"
        fi

    - name: Verify assets presence
      run: |
        echo "=== Web assets ==="
        ls android/app/src/main/assets/public/ || echo "no public assets"
        echo "=== Android icons ==="
        ls android/app/src/main/res/ | grep mipmap || echo "no mipmap"
        echo "=== Splash screen ==="
        ls android/app/src/main/res/ | grep drawable || echo "no drawable"

    - name: Build Android APK (Debug)
      working-directory: android
      run: |
        gradle assembleDebug

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KWA-WATT-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
