<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: ws:; frame-src https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>KWA-WATT</title>
    <style>
      /* Écran de démarrage : indigo + logo, affiché dès que le HTML est lu (avant le JavaScript). Évite la page blanche
         après le splash natif et montre le logo même quand le splash système ne l'affiche pas. */
      html:not(.app-ready),
      html:not(.app-ready) body { background: #1e1b4b; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1b4b; }
      #boot svg { width: 132px; height: 132px; }
      #boot .boot-arc { animation: boot-pulse 1.4s ease-in-out infinite; }
      #boot p { margin: 18px 0 0; font: 700 18px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; color: #fff; opacity: .9; }
      @keyframes boot-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-arc { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Chargement de KWA-WATT">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M278.7,745.3 A330,330 0 1 1 745.3,745.3" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="64" stroke-linecap="round"/>
        <path class="boot-arc" d="M278.7,745.3 A330,330 0 1 1 779.3,318.5" fill="none" stroke="#fa991d" stroke-width="64" stroke-linecap="round"/>
        <g transform="translate(0 11) translate(512 515) scale(0.66) translate(-512 -515)"><path d="M455,90 L300,560 L470,560 L400,940 L735,430 L560,430 L665,90 Z" fill="#ffffff"/></g>
      </svg>
      <p>KWA-WATT</p>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
